name: Build multiplatform executables with Nuitka

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka==2.2.3

      - name: Build Windows Executable with Nuitka
        run: python -m nuitka --standalone --enable-plugin=tk-inter --windows-disable-console --windows-icon-from-ico=imagenes/icono.ico --output-dir=build principal.py

      - name: Renombrar binario
        run: |
          $BIN = Get-ChildItem -Path build/principal.dist -Filter *.exe | Select-Object -First 1
          Rename-Item -Path $BIN.FullName -NewName LedsUp-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ledsup-windows
          path: build/principal.dist/LedsUp-windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          pip install -r requirements.txt

      - name: Build Linux Executable with Nuitka
        run: |
          python3 -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --output-dir=build \
            principal.py

      - name: Renombrar binario
        run: |
          BIN=$(find build/principal.dist -type f -name '*.bin' | head -n 1)
          echo "Archivo encontrado: $BIN"
          if [ -z "$BIN" ]; then
            echo "No se encontró ejecutable. Build fallido o ruta inesperada."
            exit 1
          fi
          mv "$BIN" LedsUp-macos

      - uses: actions/upload-artifact@v4
        with:
          name: ledsup-linux
          path: LedsUp-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          brew install gcc
          pip install -r requirements.txt

      - name: Build macOS Executable with Nuitka
        run: |
          python3 -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --output-dir=build \
            principal.py

      - name: Listar archivos de salida
        run: |
          ls -l build/principal.dist

      - name: Renombrar binario
        run: |
          BIN=$(find build/principal.dist -type f -name '*.bin' | head -n 1)
          echo "Archivo encontrado: $BIN"
          if [ -z "$BIN" ]; then
            echo "No se encontró ejecutable. Build fallido o ruta inesperada."
            exit 1
          fi
          mv "$BIN" LedsUp-macos

      - uses: actions/upload-artifact@v4
        with:
          name: ledsup-macos
          path: LedsUp-macos

  release:
    needs: [ build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          find artifacts -type f -name "LedsUp-*" -exec cp {} release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Última versión compilada
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
